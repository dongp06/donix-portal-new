  <!-- Antenna -->
  <rect x="249" y="98" width="14" height="35" rx="7" fill="#0B57D0"/>
  <circle cx="256" cy="92" r="14" fill="#0B57D0"/>

  <!-- Bot shell -->
  <rect x="173" y="132" width="166" height="118" rx="51" fill="white" stroke="#0B57D0" stroke-width="8"/>

  <!-- Ears -->
  <rect x="155" y="163" width="31" height="56" rx="15.5" fill="#0B57D0"/>
  <rect x="326" y="163" width="31" height="56" rx="15.5" fill="#0B57D0"/>

  <!-- Face -->
  <rect x="191" y="154" width="130" height="72" rx="30" fill="url(#faceGradient)"/>

  <!-- Eyes -->
  <circle cx="229" cy="190" r="10" fill="#10C98A"/>
  <circle cx="283" cy="190" r="10" fill="#10C98A"/>

  <!-- Trust check -->
  <path d="M218 298 L244 324 L298 270" stroke="url(#checkGradient)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
