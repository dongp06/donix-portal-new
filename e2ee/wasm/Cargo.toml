[package]
name = "thuebot-libsignal-wasm"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Browser WASM bridge for the pinned official Signal libsignal protocol implementation"

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1.89"
base64 = "0.22.1"
getrandom = { version = "0.2.17", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
js-sys = "0.3.104"
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "b056faa6dd02961cff24064c54c089c52e1a0753", package = "libsignal-protocol" }
rand = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.56"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
